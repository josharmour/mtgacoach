name: Managed desktop releases
on:
  release:
    types: [published]
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      lane:
        type: choice
        options: [master, stable]
        default: master
      version:
        description: Existing v4.0.x tag matching a published master build (stable only)
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: managed-desktop-${{ inputs.lane || (github.event_name == 'release' && 'stable') || 'master' }}
  cancel-in-progress: false
jobs:
  select:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v')) || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      version: ${{ steps.pick.outputs.version }}
      lane: ${{ steps.pick.outputs.lane }}
      build: ${{ steps.pick.outputs.build }}
      cache_epoch: ${{ steps.pick.outputs.cache_epoch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          LANE: ${{ inputs.lane || (github.event_name == 'release' && 'stable') || 'master' }}
          TAG: ${{ inputs.version || github.event.release.tag_name }}
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [[ "$LANE" == stable ]]; then
            python scripts/release_version.py tag "$TAG" > /dev/null
            COMMIT=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
            manifests=$(mktemp -d)
            gh release download -R "$GITHUB_REPOSITORY" coach-master-feed --pattern 'published.master-*.json' --dir "$manifests"
            version=$(python scripts/release_version.py promote "$TAG" "$COMMIT" "$manifests")
          else
            version=$(python scripts/release_version.py master "$GITHUB_RUN_NUMBER")
          fi
          if [[ "$GITHUB_EVENT_NAME" != workflow_run ]]; then
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs?head_sha=$COMMIT&event=push" --jq 'any(.workflow_runs[]; .conclusion == "success" and .head_branch == "master")')
            [[ "$passed" == true ]] || { echo "No successful master test run for $COMMIT"; exit 1; }
          fi
          feed_body=$(gh release view -R "$GITHUB_REPOSITORY" "coach-$LANE-feed" --json body --jq .body 2>/dev/null || true)
          build=true
          if [[ "$LANE" == master && "$COMMIT" != "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)" ]]; then build=false; fi
          if grep -Fxq "Published commit $COMMIT" <<< "$feed_body" && { [[ "$LANE" == master ]] || { grep -Fxq "Version $version" <<< "$feed_body" || grep -Fxq "Package version $version" <<< "$feed_body"; }; }; then build=false; fi
          if [[ "$build" == true ]]; then
            feed="coach-$LANE-feed"
            if ! gh release view -R "$GITHUB_REPOSITORY" "$feed" --json tagName >/dev/null 2>&1; then
              gh release create -R "$GITHUB_REPOSITORY" "$feed" --target "$COMMIT" --prerelease --latest=false --title "Coach $LANE update feed" --notes "Each platform publishes after its own checks pass. See the published.<channel>.json assets for the commit and version available on each platform."
            fi
          fi
          echo "cache_epoch=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "lane=$LANE" >> "$GITHUB_OUTPUT"
          echo "sha=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
  build:
    needs: select
    if: needs.select.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, rid: win-x64}
          - {os: ubuntu-22.04, rid: linux-x64}
          - {os: macos-latest, rid: osx-arm64}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/managed-platform.yml
    with:
      os: ${{ matrix.os }}
      rid: ${{ matrix.rid }}
      sha: ${{ needs.select.outputs.sha }}
      lane: ${{ needs.select.outputs.lane }}
      version: ${{ needs.select.outputs.version }}
      cache_epoch: ${{ needs.select.outputs.cache_epoch }}
  publish:
    needs: [select, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Record the completed release after all platforms publish
        env:
          GH_TOKEN: ${{ github.token }}
          LANE: ${{ needs.select.outputs.lane }}
          SHA: ${{ needs.select.outputs.sha }}
          VERSION: ${{ needs.select.outputs.version }}
        run: |
          if [[ "$LANE" == master && "$SHA" != "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)" ]]; then
            exit 0
          fi
          printf 'Install once to follow this %s channel. Each platform publishes after its own checks pass. The published.<channel>.json assets identify the latest available build per platform.\n\nLast release completed on every supported platform:\nPublished commit %s\nVersion %s\n' "$LANE" "$SHA" "$VERSION" > "$RUNNER_TEMP/feed-notes.md"
          gh release edit -R "$GITHUB_REPOSITORY" "coach-$LANE-feed" --title "MTGA Coach — ${LANE^}" --notes-file "$RUNNER_TEMP/feed-notes.md"
