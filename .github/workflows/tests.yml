name: tests

# The single CI workflow: one pytest run, one ruff run, per push/PR.
#
# 2026-07-24 consolidation: this ran alongside ci.yml, and BOTH executed the
# full ~700-test suite on every push to master with divergent configs
# (ci.yml: Python 3.11 + .[dev,full]; tests.yml: Python 3.12 + .[dev]).
# That doubled CI cost and, worse, meant a change could be green in one
# environment and red in the other. ci.yml has been removed; its
# dev+full extras (which match the local dev environment the test baseline
# is measured in) were folded in here.
#
# Platform-specific tests (Windows/macOS-only) rely on their own skip guards.
on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # sounddevice -> portaudio, soundfile -> libsndfile, PySide6 offscreen -> GL/xkb
      - name: System dependencies (Qt offscreen + audio libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libportaudio2 libsndfile1 \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install package with dev + full extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,full]"

      - name: Run tests
        env:
          ARENAMCP_LOG_FILE: /tmp/arenamcp-pytest.log
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q --tb=short

  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Pinned: the repo is formatted with 0.15.22. Older pins format
      # differently (0.15.2) or cannot parse [tool.ruff.lint] at all (0.6.9
      # rejects the UP045 selector), so an unpinned/stale ruff fails CI on
      # correctly-formatted code.
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.22"
          args: "check src tests"
      - run: ruff format --check src tests
