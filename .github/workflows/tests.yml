name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # sounddevice -> portaudio, soundfile -> libsndfile, PySide6 offscreen -> GL/xkb
      - name: System dependencies (Qt offscreen + audio libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libportaudio2 libsndfile1 \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install package with dev extras
        run: pip install -e .[dev]

      - name: Run tests
        env:
          ARENAMCP_LOG_FILE: /tmp/arenamcp-pytest.log
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q --tb=short

  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.6.9"
      - run: ruff check src tests
      - run: ruff format --check src tests
