name: build-installer

# Builds mtgacoach-Setup.exe on a Windows runner and attaches it to the
# release for the pushed tag, alongside the Python wheel (.whl) artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the installer to (e.g. v2.4.0)"
        required: false
        default: ""

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem installer\*.ps1 | ForEach-Object {
            $file = $_
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($parseError in $errors) {
              Write-Host "::error file=$($file.Name),line=$($parseError.Extent.StartLineNumber)::$($parseError.Message)"
              $failed = $true
            }
          }
          if ($failed) { throw "PowerShell syntax validation failed" }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build hatchling

      # Arena's managed references are available on the Windows bridge build host,
      # not this packaging runner. Refuse stale/unproven DLL bytes before either
      # the wheel or installer can package them.
      - name: Verify current-source Windows bridge build
        run: python scripts/verify_bridge_release.py

      - name: Build Python wheel
        run: python -m build --wheel

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Set up runtime Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Populate relocatable runtime (dist/runtime)
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist\*.whl -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $wheel) { throw "No wheel found under dist" }
          .\installer\build-runtime.ps1 `
            -WheelPath $wheel.FullName `
            -PythonHome $env:pythonLocation `
            -RuntimeDir (Join-Path $PWD "dist\runtime") `
            -RepoRoot $PWD

      - name: Verify staged runtime relocation
        shell: pwsh
        run: |
          .\installer\verify-runtime-relocation.ps1 `
            -RuntimeDir (Join-Path $PWD "dist\runtime") `
            -CheckoutRoot $PWD `
            -Relocate `
            -Label "ci-staged"

      - name: Build installer
        shell: pwsh
        run: |
          # Version source of truth: src/arenamcp/__init__.py. pyproject.toml
          # uses hatch dynamic versioning and has no literal `version = "..."`
          # line, so the old fallback could never resolve a version.
          $versionMatch = Select-String -Path "src\arenamcp\__init__.py" -Pattern '^\s*__version__\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $versionMatch) { throw "Could not read __version__ from src/arenamcp/__init__.py" }
          $packageVersion = $versionMatch.Matches[0].Groups[1].Value

          $version = "${{ inputs.release_tag || github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d') { $version = $packageVersion }
          if ($version -ne $packageVersion) {
            Write-Host "::warning::Release tag version '$version' does not match package __version__ '$packageVersion' - the installer asset will be stamped '$version'."
          }

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$version /Fmtgacoach-Setup installer\mtgacoach.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          if (-not (Test-Path dist\installer\mtgacoach-Setup.exe)) { throw "installer not produced" }

      - name: Verify installed runtime in a path with spaces
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP ("mtgacoach install " + [guid]::NewGuid().ToString("N"))
          $setup = Join-Path $PWD "dist\installer\mtgacoach-Setup.exe"
          $process = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/DIR=`"$installDir`""
          )
          if ($process.ExitCode -ne 0) { throw "silent install failed with exit code $($process.ExitCode)" }
          if (-not (Test-Path (Join-Path $installDir "runtime\python.exe"))) {
            throw "installed runtime missing at $installDir\runtime\python.exe"
          }
          .\installer\verify-runtime-relocation.ps1 `
            -RuntimeDir (Join-Path $installDir "runtime") `
            -AppRoot $installDir `
            -CheckoutRoot $PWD `
            -Label "ci-installed"

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.release_tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          # The managed stable feed owns the canonical setup name for new releases.
          Move-Item dist/installer/mtgacoach-Setup.exe dist/installer/mtgacoach-Legacy-Setup.exe
          gh release upload "$tag" dist/installer/mtgacoach-Legacy-Setup.exe --clobber
          Get-ChildItem -Path dist\*.whl | ForEach-Object {
            gh release upload "$tag" $_.FullName --clobber
          }

      - name: Upload installer artifact (non-tag runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.release_tag == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mtgacoach-Setup
          path: dist/installer/mtgacoach-Setup.exe
          if-no-files-found: error

      - name: Upload wheel artifact (non-tag runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.release_tag == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mtgacoach-wheel
          path: dist/*.whl

