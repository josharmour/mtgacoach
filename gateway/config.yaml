# Hosted customer model: GLM 5.3. No retired model names in customer grants.
# Current live backend runs on blackwell's Docker network.
model_list:
  - model_name: glm-5.3-flash
    litellm_params:
      model: openai/glm-5.3-flash-local
      api_base: http://glm53-flash-2x-rtxpro6000:8001/v1
      api_key: none
      input_cost_per_token: 0
      output_cost_per_token: 0

  # Service alias for a separate application, not offered by either MTGA app.
  - model_name: sc-generator
    litellm_params:
      model: openai/glm-5.3-flash-local
      api_base: http://glm53-flash-2x-rtxpro6000:8001/v1
      api_key: none
      input_cost_per_token: 0
      output_cost_per_token: 0

litellm_settings:
  success_callback: [langfuse]
  drop_params: true
  num_retries: 1
  request_timeout: 1800
  require_auth_for_metrics_endpoint: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  store_prompts_in_spend_logs: true
  prometheus_metrics: true
